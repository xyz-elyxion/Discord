name: Release

# Builds every downloadable artifact here instead of inside the Docker image,
# then publishes it as a GitHub Release. The site links straight at
# /releases/latest/download/<asset>, so a download never depends on a container
# rebuild finishing first, and the image pulls the desktop build from the
# release instead of packaging it. Every push to main refreshes the rolling
# "latest" release and then deploys Render; a v* tag cuts a versioned
# release; running it by hand does the same on demand.
on:
    push:
        branches:
            - main
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

# Every run uploads to the same `latest` release and ends with a Render
# deploy, so runs are serialised: two overlapping builds would clobber each
# other's assets and race two deploys.
concurrency:
    group: release
    cancel-in-progress: false

env:
    FORCE_COLOR: true
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    REPO: ${{ github.repository }}
    # electron-builder fetches Electron per target; the CDN mirror is faster and
    # less prone to rate limits than the GitHub release download.
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Enable corepack (each sub-project pins its own pnpm)
              run: sudo corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # buildWeb is buildWeb.mjs + zipExtension.mjs + buildMonaco.mjs, so
            # this produces the userscript, the loadable extension zip and the
            # Monaco vendor bundle in one step.
            - name: Build the web bundle, extension zip and Monaco bundle
              run: pnpm buildWebStandalone

            - name: Build the client bundle
              run: pnpm build --standalone

            # Same cross-compile the Dockerfile used to do, but on the CI runner.
            # mingw is only needed for the cgo-based Windows GUI installer.
            - name: Build the installer binaries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends mingw-w64
                  cd installer
                  CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ GOOS=windows GOARCH=amd64 \
                      go build -ldflags "-H windowsgui -s -w" -o ../dist/LimeyV1Installer.exe .
                  CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags cli -ldflags "-s -w -extldflags=-static" -o ../dist/LimeyV1Installer-cli-win.exe .
                  CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags cli -ldflags "-s -w" -o ../dist/LimeyV1Installer-cli-macos-arm64 .
                  CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags cli -ldflags "-s -w" -o ../dist/LimeyV1Installer-cli-macos-amd64 .
                  CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags cli -ldflags "-s -w -extldflags=-static" -o ../dist/LimeyV1Installer-cli-linux .

            # Ghost Client overlay: electron-builder only zips the win32-x64
            # Electron dist, so no Wine is needed. The pre-fetch script fills
            # electron-builder's cache first (some hosts block the download).
            - name: Build the Ghost Client
              working-directory: ghost-client
              run: |
                  pnpm install --frozen-lockfile=false --ignore-scripts
                  node scripts/fetch-electron-dist.mjs
                  pnpm build:win

            # Desktop standalone client: esbuild bundles into dist/js, then
            # electron-builder adds the Linux AppImage/.tar.gz and the portable
            # Windows zip. The whole build output is archived as well — the web
            # server serves those files (and the packaged installers next to
            # them) at /dist/limeyDesktop and /v1/install/desktop-app.
            - name: Build the desktop client
              env:
                  XDG_CACHE_HOME: ${{ runner.temp }}/electron-cache
              run: |
                  cd desktop
                  pnpm install --frozen-lockfile --ignore-scripts
                  pnpm rebuild esbuild
                  pnpm build
                  test -f dist/js/main.js
                  pnpm exec electron-builder --linux AppImage tar.gz --publish never
                  pnpm exec electron-builder --win zip --x64 --publish never
                  rm -rf dist/linux-unpacked dist/win-unpacked dist/*.blockmap \
                      dist/builder-debug.yml dist/builder-effective-config.yaml
                  tar -czf "$GITHUB_WORKSPACE/LimeyV1Desktop-build.tar.gz" dist static package.json

            - name: Resolve the release tag
              run: |
                  if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                      echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
                  else
                      echo "TAG=latest" >> "$GITHUB_ENV"
                  fi

            - name: Publish the release
              run: |
                  set -euo pipefail
                  assets=(
                      dist/LimeyV1Installer.exe
                      dist/LimeyV1Installer-cli-win.exe
                      dist/LimeyV1Installer-cli-macos-arm64
                      dist/LimeyV1Installer-cli-macos-amd64
                      dist/LimeyV1Installer-cli-linux
                      dist/LimeyV1.user.js
                      dist/LimeyV1-Extension.zip
                      dist/browser.js
                      dist/browser.css
                      ghost-client/dist/LimeyV1GhostClient-win-x64-1.0.0.zip
                      LimeyV1Desktop-build.tar.gz
                  )
                  for asset in "${assets[@]}"; do
                      test -f "$asset" || { echo "missing build artifact: $asset" >&2; exit 1; }
                  done

                  if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                      gh release create "$TAG" --repo "$REPO" --latest \
                          --title "Limey V1 $TAG" \
                          --notes "Automated build of $GITHUB_SHA. Every download on the site is served from this release."
                  fi
                  gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber

            # Only after every artifact is on the release: the Render image pulls
            # LimeyV1Desktop-build.tar.gz from it during the Docker build, so
            # deploying any earlier would build against a release that isn't there.
            # The deploy hook key lives in the RENDER_DEPLOY_KEY secret, never in
            # the repo. Deploys are limited to main and version tags so a manual
            # run from a feature branch can't take the live site down.
            - name: Deploy to Render
              if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
              env:
                  RENDER_DEPLOY_HOOK: https://api.render.com/deploy/srv-datf64favr4c73da5lvg?key=${{ secrets.RENDER_DEPLOY_KEY }}
                  RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
              run: |
                  if [[ -z "$RENDER_DEPLOY_KEY" ]]; then
                      echo "RENDER_DEPLOY_KEY is not set — add it under Settings → Secrets and variables → Actions." >&2
                      exit 1
                  fi

                  # No -f: a rejected hook still has an HTTP status worth reporting,
                  # and curl's exit code alone (22) does not say which one.
                  status=$(curl -sS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null \
                      -w "%{http_code}" --max-time 30 --retry 1 --retry-connrefused) || true
                  echo "Render deploy hook answered HTTP $status"

                  case "$status" in
                      200|201|202)
                          echo "Render deploy triggered."
                          ;;
                      404)
                          echo "::error::Render does not recognise this deploy hook (HTTP 404)." >&2
                          echo "Render answers 404, not 401, when either the service id or the key is wrong." >&2
                          echo "Check, in this order:" >&2
                          echo "  1. The RENDER_DEPLOY_KEY secret: a trailing newline or space makes the key invalid." >&2
                          echo "     Regenerate it from Render → the service → Settings → Deploy Hook and re-save the secret." >&2
                          echo "  2. The srv id in this workflow (srv-datf64favr4c73da5lvg): if the service was" >&2
                          echo "     deleted or recreated, the hook points at a service that no longer exists." >&2
                          echo "The release above is published and downloadable; only the deploy did not happen." >&2
                          exit 1
                          ;;
                      *)
                          echo "::error::Render deploy failed (HTTP $status)." >&2
                          echo "The release above is published and downloadable; only the deploy did not happen." >&2
                          exit 1
                          ;;
                  esac
