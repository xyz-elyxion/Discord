<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limey V1 Code — plugin editor</title>
    <meta name="description" content="Limey V1 Code — a VS Code-style plugin editor that runs in your browser, powered by Monaco, with the Limey plugin API built in.">
    <link rel="icon" href="/browser/icon.png" type="image/png">
    <link rel="stylesheet" href="/vendor/monaco/index.css">
    <style>
        :root {
            --lc-bg: #0d0d0d;
            --lc-panel: #121212;
            --lc-panel-2: #171717;
            --lc-border: #262626;
            --lc-text: #e6e6e6;
            --lc-dim: #8b8b8b;
            --lc-lime: #9ccc3c;
            --lc-lime-dim: #6f8f2b;
            --lc-blue: #60a5fa;
            --lc-amber: #f0b429;
            --lc-red: #f87171;
            --lc-mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--lc-bg);
            color: var(--lc-text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        kbd {
            font-family: var(--lc-mono);
            font-size: 0.68rem;
            padding: 1px 5px;
            border: 1px solid var(--lc-border);
            border-bottom-width: 2px;
            border-radius: 4px;
            color: var(--lc-dim);
            background: #1b1b1b;
        }
        #app {
            display: grid;
            grid-template-rows: 40px 1fr;
            height: 100%;
        }

        /* ---------- title bar ---------- */
        #titlebar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 12px;
            background: var(--lc-panel);
            border-bottom: 1px solid var(--lc-border);
            font-size: 0.8rem;
            user-select: none;
        }
        .tb-left { display: flex; align-items: center; gap: 8px; }
        .tb-left .logo { font-size: 1rem; }
        .tb-left strong { font-size: 0.85rem; letter-spacing: 0.01em; }
        .tb-left .tb-sub { color: var(--lc-dim); }
        #commandTrigger {
            flex: 1;
            max-width: 460px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 26px;
            padding: 0 12px;
            border: 1px solid var(--lc-border);
            border-radius: 7px;
            background: var(--lc-panel-2);
            color: var(--lc-dim);
            font-size: 0.76rem;
        }
        #commandTrigger:hover { border-color: #3a3a3a; color: var(--lc-text); }
        .tb-right { display: flex; align-items: center; gap: 14px; }
        .tb-right a { color: var(--lc-dim); text-decoration: none; font-size: 0.76rem; }
        .tb-right a:hover { color: var(--lc-lime); }

        /* ---------- body ---------- */
        #body {
            display: grid;
            grid-template-columns: 48px 260px 1fr;
            min-height: 0;
        }
        #activity {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-top: 8px;
            background: var(--lc-panel);
            border-right: 1px solid var(--lc-border);
        }
        .act-btn {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: var(--lc-dim);
            position: relative;
        }
        .act-btn:hover { color: var(--lc-text); background: #1c1c1c; }
        .act-btn.active { color: var(--lc-lime); }
        .act-btn.active::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            border-radius: 2px;
            background: var(--lc-lime);
        }

        #sidebar {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--lc-panel);
            border-right: 1px solid var(--lc-border);
            font-size: 0.78rem;
        }
        #sidebar[hidden] { display: none; }
        .side-head {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 12px 8px;
            color: var(--lc-dim);
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        .side-head .spacer { flex: 1; }
        .side-head button {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            border-radius: 5px;
            color: var(--lc-dim);
        }
        .side-head button:hover { background: #1f1f1f; color: var(--lc-text); }
        #tree { flex: 1; overflow: auto; padding: 0 6px 12px; }
        .node {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 6px;
            border-radius: 5px;
            color: #cfcfcf;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
        }
        .node:hover { background: #1b1b1b; }
        .node.active { background: #22300f; color: #fafafa; }
        .node .twist {
            width: 10px;
            color: var(--lc-dim);
            font-size: 0.6rem;
            flex-shrink: 0;
        }
        .node .name { overflow: hidden; text-overflow: ellipsis; }
        .node .ext {
            flex-shrink: 0;
            font-family: var(--lc-mono);
            font-size: 0.56rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            padding: 1px 4px;
            border-radius: 3px;
            color: #0d0d0d;
            background: #6b7280;
        }
        .node .ext.ts, .node .ext.tsx { background: #3b82f6; color: #fff; }
        .node .ext.css { background: #a855f7; color: #fff; }
        .node .ext.md { background: #64748b; color: #fff; }
        .node .ext.json { background: #eab308; }
        .node .row-actions { margin-left: auto; display: none; gap: 2px; }
        .node:hover .row-actions { display: flex; }
        .node .row-actions button {
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            border-radius: 4px;
            color: var(--lc-dim);
            font-size: 0.7rem;
        }
        .node .row-actions button:hover { background: #2a2a2a; color: var(--lc-text); }
        .side-foot {
            padding: 8px 12px;
            border-top: 1px solid var(--lc-border);
            color: var(--lc-dim);
            font-size: 0.7rem;
        }

        /* ---------- editor ---------- */
        #main {
            display: grid;
            grid-template-rows: 34px 1fr 24px;
            min-width: 0;
            min-height: 0;
        }
        #tabs {
            display: flex;
            align-items: stretch;
            overflow-x: auto;
            background: var(--lc-panel);
            border-bottom: 1px solid var(--lc-border);
            scrollbar-width: none;
        }
        #tabs::-webkit-scrollbar { display: none; }
        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            max-width: 220px;
            border-right: 1px solid var(--lc-border);
            color: var(--lc-dim);
            font-size: 0.76rem;
            white-space: nowrap;
        }
        .tab:hover { background: #171717; color: var(--lc-text); }
        .tab.active {
            background: var(--lc-bg);
            color: var(--lc-text);
            box-shadow: inset 0 -1px 0 var(--lc-lime);
        }
        .tab .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--lc-dim);
            flex-shrink: 0;
        }
        .tab.dirty .dot { background: var(--lc-lime); }
        .tab .close {
            width: 16px;
            height: 16px;
            display: grid;
            place-items: center;
            border-radius: 3px;
            color: var(--lc-dim);
            font-size: 0.72rem;
            flex-shrink: 0;
        }
        .tab .close:hover { background: #2a2a2a; color: var(--lc-text); }
        #editorWrap { position: relative; min-width: 0; min-height: 0; }
        #editor { position: absolute; inset: 0; }
        #fallback {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 12px;
            border: 0;
            resize: none;
            outline: none;
            background: var(--lc-bg);
            color: var(--lc-text);
            font-family: var(--lc-mono);
            font-size: 13px;
            line-height: 1.55;
            tab-size: 4;
        }
        #statusbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 12px;
            background: var(--lc-panel);
            border-top: 1px solid var(--lc-border);
            color: var(--lc-dim);
            font-size: 0.7rem;
            font-family: var(--lc-mono);
            user-select: none;
        }
        #statusbar .grow { flex: 1; }
        #statusbar .ok { color: var(--lc-lime); }
        #statusbar .err { color: var(--lc-red); }
        #statusbar .warn { color: var(--lc-amber); }

        /* ---------- overlays ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 72px;
            background: rgba(0, 0, 0, 0.55);
        }
        .overlay[hidden] { display: none; }
        .modal {
            width: min(640px, 92vw);
            background: var(--lc-panel-2);
            border: 1px solid var(--lc-border);
            border-radius: 10px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        .modal input {
            width: 100%;
            padding: 12px 14px;
            border: 0;
            border-bottom: 1px solid var(--lc-border);
            outline: none;
            background: #1b1b1b;
            color: var(--lc-text);
            font-size: 0.85rem;
            font-family: inherit;
        }
        .modal-list { max-height: 46vh; overflow: auto; padding: 6px; }
        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .row .label { flex: 1; }
        .row .hint { color: var(--lc-dim); font-size: 0.72rem; font-family: var(--lc-mono); }
        .row.active { background: #26320f; }
        .row:hover { background: #1f1f1f; }
        .empty { padding: 18px; text-align: center; color: var(--lc-dim); font-size: 0.8rem; }

        /* ---------- work area, panel, preview ---------- */
        #workArea { display: flex; min-width: 0; min-height: 0; }
        #editorColumn {
            flex: 1;
            display: grid;
            grid-template-rows: 1fr auto;
            min-width: 0;
            min-height: 0;
        }
        #previewColumn {
            width: 370px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--lc-border);
            background: var(--lc-panel);
        }
        #previewColumn[hidden] { display: none; }
        .panel-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--lc-border);
            color: var(--lc-dim);
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        .panel-head .spacer { flex: 1; }
        .panel-head button {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            border-radius: 5px;
            color: var(--lc-dim);
            font-size: 0.7rem;
        }
        .panel-head button:hover { background: #1f1f1f; color: var(--lc-text); }
        #previewFrame { flex: 1; width: 100%; border: 0; background: #313338; }

        #panel {
            height: 236px;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--lc-border);
            background: var(--lc-panel);
        }
        #panel[hidden] { display: none; }
        #panelTabs {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 3px 8px 0;
            border-bottom: 1px solid var(--lc-border);
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #panelTabs .spacer { flex: 1; }
        .panel-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 6px 6px 0 0;
            color: var(--lc-dim);
        }
        .panel-tab:hover { color: var(--lc-text); }
        .panel-tab.active { color: var(--lc-text); background: var(--lc-bg); box-shadow: inset 0 -2px 0 var(--lc-lime); }
        .panel-tab .count {
            padding: 0 5px;
            border-radius: 999px;
            background: #2a2a2a;
            color: var(--lc-dim);
            font-size: 0.62rem;
            letter-spacing: 0;
        }
        .panel-tab .count.bad { background: #3b1a1a; color: #fca5a5; }
        .panel-body { flex: 1; overflow: auto; padding: 6px; }
        .panel-body[hidden] { display: none; }
        .panel-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 5px;
            font-family: var(--lc-mono);
            font-size: 0.72rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
        }
        .panel-row:hover { background: #1e1e1e; }
        .panel-row.hit { padding-left: 26px; }
        .panel-row .where { color: var(--lc-dim); flex-shrink: 0; }
        .panel-row .src { color: #cfcfcf; overflow: hidden; text-overflow: ellipsis; }
        .panel-row .src b { color: var(--lc-lime); font-weight: 700; }
        .sev { width: 12px; text-align: center; flex-shrink: 0; }
        .sev.error { color: var(--lc-red); }
        .sev.warning { color: var(--lc-amber); }
        .sev.info { color: var(--lc-blue); }
        .panel-empty { padding: 18px; text-align: center; color: var(--lc-dim); font-size: 0.78rem; }

        #searchBody { display: flex; flex-direction: column; }
        #searchBody[hidden] { display: none; }
        #searchBar { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 8px; }
        #searchBar input[type="text"] {
            flex: 1;
            min-width: 130px;
            padding: 6px 9px;
            border-radius: 6px;
            border: 1px solid var(--lc-border);
            background: #1b1b1b;
            color: var(--lc-text);
            font-family: var(--lc-mono);
            font-size: 0.74rem;
            outline: none;
        }
        #searchBar input[type="text"]:focus { border-color: var(--lc-lime-dim); }
        .chip {
            padding: 5px 9px;
            border-radius: 6px;
            border: 1px solid var(--lc-border);
            background: #1b1b1b;
            color: var(--lc-dim);
            font-size: 0.7rem;
            font-family: var(--lc-mono);
        }
        .chip:hover { border-color: #3a3a3a; color: var(--lc-text); }
        .chip.on { background: var(--lc-lime); border-color: var(--lc-lime); color: #0d0d0d; font-weight: 700; }
        #searchResults { flex: 1; overflow: auto; min-height: 0; }
        .file-group { margin-bottom: 2px; }
        .file-group > .file-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 5px;
            color: var(--lc-text);
            font-size: 0.74rem;
            cursor: pointer;
        }
        .file-group > .file-head:hover { background: #1e1e1e; }
        .file-group > .file-head .hits { margin-left: auto; color: var(--lc-dim); font-size: 0.68rem; font-family: var(--lc-mono); }

        /* ---------- settings, shortcuts, templates ---------- */
        .modal.wide { width: min(780px, 94vw); }
        .modal-head {
            padding: 12px 16px;
            border-bottom: 1px solid var(--lc-border);
            color: var(--lc-dim);
            font-size: 0.66rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            padding: 16px;
            max-height: 58vh;
            overflow: auto;
        }
        .field { display: flex; flex-direction: column; gap: 5px; font-size: 0.8rem; }
        .field.check { flex-direction: row; align-items: center; gap: 9px; }
        .field.check input { width: 15px; height: 15px; accent-color: var(--lc-lime); }
        .field select, .field input[type="number"] {
            padding: 7px 9px;
            border-radius: 6px;
            border: 1px solid var(--lc-border);
            background: #1b1b1b;
            color: var(--lc-text);
            font-family: var(--lc-mono);
            font-size: 0.76rem;
            outline: none;
        }
        .field small { color: var(--lc-dim); font-size: 0.7rem; }
        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--lc-border);
        }
        .btn-sm {
            padding: 7px 15px;
            border-radius: 6px;
            border: 1px solid var(--lc-border);
            background: #1b1b1b;
            color: var(--lc-text);
            font-size: 0.76rem;
        }
        .btn-sm:hover { border-color: #3a3a3a; }
        .btn-sm.primary { background: var(--lc-lime); border-color: var(--lc-lime); color: #0d0d0d; font-weight: 700; }
        .shortcut-table { width: 100%; border-collapse: collapse; font-size: 0.79rem; }
        .shortcut-table td { padding: 6px 16px; border-bottom: 1px solid #1c1c1c; }
        .shortcut-table td:last-child { text-align: right; color: var(--lc-dim); font-family: var(--lc-mono); font-size: 0.72rem; }
        .tpl-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 14px;
            max-height: 56vh;
            overflow: auto;
        }
        .tpl-card {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid var(--lc-border);
            background: #1b1b1b;
            text-align: left;
        }
        .tpl-card:hover { border-color: var(--lc-lime-dim); background: #1f1f1f; }
        .tpl-card strong { font-size: 0.82rem; }
        .tpl-card span { color: var(--lc-dim); font-size: 0.72rem; line-height: 1.45; }
        .tpl-card .files { color: var(--lc-lime-dim); font-family: var(--lc-mono); font-size: 0.66rem; }
        body.zen #titlebar, body.zen #activity, body.zen #sidebar, body.zen #panel, body.zen #statusbar { display: none !important; }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(8px);
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid var(--lc-border);
            background: #1b1b1b;
            color: var(--lc-text);
            font-size: 0.78rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s, transform 0.18s;
            z-index: 60;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.bad { border-color: var(--lc-red); color: #fecaca; }

        #hiddenInput { display: none; }
        @media (max-width: 820px) {
            #body { grid-template-columns: 44px 0 1fr; }
            #sidebar { display: none; }
            #previewColumn { display: none !important; }
            #panel { height: 180px; }
            .settings-grid, .tpl-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app">
    <header id="titlebar">
        <div class="tb-left">
            <span class="logo">🍋</span>
            <strong>Limey V1 Code</strong>
            <span class="tb-sub">plugin editor</span>
        </div>
        <button id="commandTrigger" type="button" title="Command palette">
            <span>Search commands…</span>
            <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>P</kbd>
        </button>
        <div class="tb-right">
            <a href="/">Home</a>
            <a href="/plugins/">Plugins</a>
            <a href="/marketplace">Marketplace</a>
            <a href="/submit-plugin">Submit</a>
        </div>
    </header>

    <div id="body">
        <nav id="activity" aria-label="Activity bar">
            <button class="act-btn active" type="button" data-activity="files" title="Explorer (Ctrl+B)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6l2 3h8v13H4z"/></svg>
            </button>
            <button class="act-btn" type="button" data-activity="search" title="Quick open (Ctrl+P)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
            <button class="act-btn" type="button" data-activity="api" title="Plugin API reference">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>
            </button>
        </nav>

        <aside id="sidebar">
            <div class="side-head">
                <span id="sideTitle">Explorer</span>
                <span class="spacer"></span>
                <button type="button" id="newFileBtn" title="New file">＋</button>
                <button type="button" id="newFolderBtn" title="New folder">🗀</button>
                <button type="button" id="uploadBtn" title="Upload files">↑</button>
            </div>
            <div id="tree"></div>
            <div class="side-foot" id="projectMeta">—</div>
        </aside>

        <main id="main">
            <div id="tabs"></div>
            <div id="workArea">
                <div id="editorColumn">
                    <div id="editorWrap">
                        <div id="editor"></div>
                        <textarea id="fallback" spellcheck="false" hidden></textarea>
                    </div>
                    <section id="panel" hidden aria-label="Panel">
                        <div id="panelTabs">
                            <button class="panel-tab active" type="button" data-panel="problems">Problems <span class="count" id="problemCount">0</span></button>
                            <button class="panel-tab" type="button" data-panel="outline">Outline</button>
                            <button class="panel-tab" type="button" data-panel="search">Search</button>

<script>
/* Limey V1 Code — a Monaco-based plugin editor.
   Everything lives in one file: the workspace model (localStorage), the file
   tree, tabs, panels and the command palette. The editor itself is Monaco,
   the same engine VS Code uses; /vendor/monaco/* is built by
   scripts/build/buildMonaco.mjs. */
(function () {
    "use strict";

    const STORAGE_KEY = "limey-code:workspace:v1";
    const DEMO_PREFIX = "MyPlugin/";

    const DEMO_FILES = {
        "MyPlugin/index.ts": `import { definePluginSettings } from "@api/Settings";
import { Devs } from "@utils/constants";
import definePlugin, { OptionType } from "@utils/types";

const settings = definePluginSettings({
    greeting: {
        type: OptionType.STRING,
        description: "What to say when the plugin starts",
        default: "hello from Limey"
    },
    loud: {
        type: OptionType.BOOLEAN,
        description: "Shout the greeting",
        default: false
    }
});

export default definePlugin({
    name: "MyPlugin",
    description: "A short, honest sentence about what this plugin does",
    authors: [Devs.Limey],
    tags: ["Fun"],
    permissions: [{
        id: "localDataStore",
        title: "Store a counter",
        description: "Keeps a number in Limey's local data store.",
        risk: "Only a number, stored locally on this device."
    }],
    settings,

    start() {
        const greeting = settings.store.loud
            ? settings.store.greeting.toUpperCase()
            : settings.store.greeting;

        console.log(greeting);
    },

    stop() {
        // Clear timers, listeners and stores here so toggling stays clean.
    }
});
`,
        "MyPlugin/README.md": `# MyPlugin

A Limey V1 plugin.

## Install

1. Download this project from Limey V1 Code (the ⬇ button in the title bar).
2. Unzip it so the folder lands in \`src/userplugins/\`.
3. \`pnpm build\` then \`pnpm inject\`, and restart Discord.
4. Enable it in **Settings → Plugins** after reviewing its permissions.

## Rules

- One plugin per folder, entry point \`index.ts\`.
- Declare every risky capability in \`permissions\`.
- \`start()\` and \`stop()\` must be symmetric.
`,
        "MyPlugin/style.css": `/* Optional styles for your plugin chrome. */
.my-plugin-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(156, 204, 60, 0.15);
    color: #9ccc3c;
    font-size: 12px;
}
`,
        "MyPlugin/plugin.json": `{
    "name": "MyPlugin",
    "version": "1.0.0",
    "limey": "^1.0.0",
    "entry": "index.ts"
}
`
    };

    /* The plugin API as the editor sees it. Monaco's TypeScript worker uses
       this file for completions, hovers and errors, so writing a plugin here
       feels like writing one in the real codebase. */
    const LIMEY_DTS = `declare module "@utils/types" {
    export interface PluginAuthor { name: string; id: bigint; }
    export interface PluginPermission {
        /** Stable id for this capability, e.g. "sendMessage". */
        id: string;
        title: string;
        description: string;
        risk: string;
    }
    export interface CommandOption {
        name: string;
        description: string;
        type: number;
        required?: boolean;
        choices?: { name: string; displayName?: string; value: string }[];
    }
    export interface PluginCommand {
        name: string;
        description: string;
        /** Use ApplicationCommandInputType.BUILT_IN to appear in Discord's own / menu. */
        inputType?: number;
        options?: CommandOption[];
        execute(args: any, ctx: any): void | Promise<void>;
    }
    export interface PatchReplacement { match: string | RegExp; replace: string | ((match: string, ...groups: string[]) => string); noWarn?: boolean; }
    export interface Patch { find: string | RegExp; replacement: PatchReplacement | PatchReplacement[]; all?: boolean; noWarn?: boolean; }
    export interface PluginDef {
        name: string;
        description: string;
        authors: PluginAuthor[];
        tags?: string[];
        searchTerms?: string[];
        dependencies?: string[];
        permissions?: PluginPermission[];
        settings?: any;
        commands?: PluginCommand[];
        patches?: Patch[];
        /** Called when the user enables the plugin. */
        start?(): void | Promise<void>;
        /** Called when the user disables it — undo everything start() did. */
        stop?(): void | Promise<void>;
        [key: string]: any;
    }
    export default function definePlugin<P extends PluginDef>(plugin: P): P;
    export enum OptionType {
        STRING = 0, NUMBER = 1, BIGINT = 2, BOOLEAN = 3,
        SELECT = 4, SLIDER = 5, COMPONENT = 6, CUSTOM = 7
    }
}

declare module "@utils/constants" {
    export interface Dev { name: string; id: bigint; }
    export const Devs: Record<string, Dev> & { Limey: Dev };
}

declare module "@api/Settings" {
    export interface SettingDefinition { type: number; description: string; default?: any; options?: any; component?: any; }
    export interface SettingsWithStore<T> { def: T; store: Record<keyof T, any>; }
    export function definePluginSettings<T extends Record<string, SettingDefinition>>(defs: T): SettingsWithStore<T>;
    export function migratePluginSettings(newName: string, oldName: string): void;
}

declare module "@api/Commands" {
    export enum ApplicationCommandInputType { BUILT_IN_TEXT, BUILT_IN_INTEGRATION, BOT, PLACEHOLDER }
    export enum ApplicationCommandOptionType {
        STRING = 3, INTEGER = 4, BOOLEAN = 5, USER = 6, CHANNEL = 7, ROLE = 8, MENTIONABLE = 9, NUMBER = 10, ATTACHMENT = 11
    }
    export interface CommandArgument { name: string; value: any; }
    export function findOption(args: CommandArgument[], name: string): any;
    export function sendBotMessage(channelId: string, message: any): void;
}

declare module "@api/DataStore" {
    export function get<T>(key: string, fallback?: T): Promise<T | undefined>;
    export function set<T>(key: string, value: T): Promise<void>;
    export function del(key: string): Promise<void>;
}

declare module "@api/Notices" {
    export function showNotice(message: any, buttonText: string, onOkClick: () => void): void;
}

declare module "@api/ContextMenu" {
    /** children is the rendered menu; mutating it is how a patch adds an item. */
    export type NavContextMenuPatchCallback = (children: Array<any>, ...args: Array<any>) => void;
    export function addContextMenuPatch(navId: string | string[], patch: NavContextMenuPatchCallback): void;
    export function removeContextMenuPatch(navId: string | string[], patch: NavContextMenuPatchCallback): void;
}

declare module "@webpack/common" {
    export const React: any;
    export const Menu: any;
    export const UserStore: any;
    export const ChannelStore: any;
    export const SelectedChannelStore: any;
}
`;

    const DEFAULT_UI = {
        minimap: false,
        wordWrap: "off",
        fontSize: 13.5,
        sidebar: true,
        tabSize: 4,
        breadcrumbs: true,
        stickyScroll: true,
        renderWhitespace: "selection",
        formatOnSave: false,
        panel: "problems",
        panelOpen: false,
        preview: false
    };

    const el = id => document.getElementById(id);

    const dom = {
        tree: el("tree"),
        tabs: el("tabs"),
        editor: el("editor"),
        editorWrap: el("editorWrap"),
        fallback: el("fallback"),
        sidebar: el("sidebar"),
        statusPath: el("stPath"),
        statusProblems: el("stProblems"),
        statusSaved: el("stSaved"),
        statusPos: el("stPos"),
        statusLang: el("stLang"),
        projectMeta: el("projectMeta"),
        palette: el("palette"),
        paletteInput: el("paletteInput"),
        paletteList: el("paletteList"),
        quick: el("quickOpen"),
        quickInput: el("quickInput"),
        quickList: el("quickList"),
        toast: el("toast"),
        hiddenInput: el("hiddenInput"),
        workArea: el("workArea"),
        panel: el("panel"),
        problemCount: el("problemCount"),
        problemsBody: el("problemsBody"),
        outlineBody: el("outlineBody"),
        searchBody: el("searchBody"),
        searchInput: el("searchInput"),
        searchReplace: el("searchReplace"),
        searchResults: el("searchResults"),
        previewColumn: el("previewColumn"),
        previewFrame: el("previewFrame"),
        settingsOverlay: el("settingsOverlay"),
        settingsGrid: el("settingsGrid"),
        shortcutsOverlay: el("shortcutsOverlay"),
        shortcutsBody: el("shortcutsBody"),
        templatesOverlay: el("templatesOverlay"),
        templatesGrid: el("templatesGrid")
    };

    /* ---------------------------------------------------------------------
     * Workspace model
     * ------------------------------------------------------------------- */

    function emptyWorkspace() {
        return {
            name: "MyPlugin",
            files: { ...DEMO_FILES },
            open: ["MyPlugin/index.ts"],
            active: "MyPlugin/index.ts",
            savedAt: new Date().toISOString(),
            ui: { ...DEFAULT_UI }
        };
    }

    function loadWorkspace() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return emptyWorkspace();
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object" || typeof parsed.files !== "object") return emptyWorkspace();
            return {
                name: typeof parsed.name === "string" ? parsed.name : "MyPlugin",
                files: parsed.files || {},
                open: Array.isArray(parsed.open) ? parsed.open.filter(p => typeof p === "string") : [],
                active: typeof parsed.active === "string" ? parsed.active : null,
                savedAt: parsed.savedAt,
                ui: { ...DEFAULT_UI, ...(parsed.ui || {}) }
            };
        } catch {
            return emptyWorkspace();
        }
    }

    const state = {
        ws: loadWorkspace(),
        models: new Map(),
        editor: null,
        monaco: null,
        dirty: new Set(),
        paletteIndex: 0,
        paletteRows: [],
        quickIndex: 0,
        quickRows: [],
        saveTimer: null
    };

    function persist() {
        clearTimeout(state.saveTimer);
        state.saveTimer = setTimeout(() => {
            try {
                state.ws.savedAt = new Date().toISOString();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.ws));
                dom.statusSaved.textContent = "saved";
                dom.statusSaved.className = "ok";
            } catch {
                dom.statusSaved.textContent = "not saved (storage full)";
                dom.statusSaved.className = "err";
            }
        }, 250);
    }

    /* ---------------------------------------------------------------------
     * Helpers
     * ------------------------------------------------------------------- */

    function languageFor(path) {
        const ext = String(path).split(".").pop().toLowerCase();
        switch (ext) {
            case "ts": case "mts": return "typescript";
            case "tsx": return "typescript";
            case "js": case "mjs": case "cjs": return "javascript";
            case "jsx": return "javascript";
            case "json": return "json";
            case "css": return "css";
            case "scss": return "scss";
            case "html": return "html";
            case "md": return "markdown";
            case "yml": case "yaml": return "yaml";
            case "txt": return "";
            default: return "plaintext";
        }
    }

    function extLabel(path) {
        const parts = String(path).split(".");
        return parts.length > 1 ? parts.pop().toLowerCase() : "txt";
    }

    /** Paths -> nested tree the explorer renders, folders first. */
    function buildTree(paths) {
        const root = { name: "", dirs: new Map(), files: [] };
        for (const path of paths) {
            const parts = String(path).split("/").filter(Boolean);
            let node = root;
            for (let i = 0; i < parts.length - 1; i++) {
                if (!node.dirs.has(parts[i])) node.dirs.set(parts[i], { name: parts[i], dirs: new Map(), files: [] });
                node = node.dirs.get(parts[i]);
            }
            if (parts.length) node.files.push(parts[parts.length - 1]);
        }
        const finish = node => ({
            name: node.name,
            dirs: [...node.dirs.values()]
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(finish),
            files: [...node.files].sort((a, b) => a.localeCompare(b))
        });
        return finish(root);
    }

    function wordCount(text) {
        return text ? text.split("\n").length : 0;
    }

    function toast(message, bad) {
        dom.toast.textContent = message;
        dom.toast.className = "show" + (bad ? " bad" : "");
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { dom.toast.className = bad ? "bad" : ""; }, 2400);
    }

    /* ---------------------------------------------------------------------
     * Zip export (store-only, so no dependency and no worker)
     * ------------------------------------------------------------------- */

    const CRC_TABLE = (() => {
        const table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
            table[n] = c >>> 0;
        }
        return table;
    })();

    function crc32(bytes) {
        let crc = 0xFFFFFFFF;
        for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
        return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    /** entries: [{ name, text }] -> Uint8Array zip archive. */
    function makeZip(entries) {
        const enc = new TextEncoder();
        const now = new Date();
        const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
        const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

        const chunks = [];
        const central = [];
        let offset = 0;

        for (const entry of entries) {
            const nameBytes = enc.encode(entry.name);
            const data = enc.encode(entry.text);
            const crc = crc32(data);

            const local = new Uint8Array(30 + nameBytes.length);
            const lv = new DataView(local.buffer);
            lv.setUint32(0, 0x04034b50, true);
            lv.setUint16(4, 20, true);          // version needed
            lv.setUint16(6, 0x0800, true);      // UTF-8 names
            lv.setUint16(8, 0, true);           // store
            lv.setUint16(10, dosTime, true);
            lv.setUint16(12, dosDate, true);
            lv.setUint32(14, crc, true);
            lv.setUint32(18, data.length, true);
            lv.setUint32(22, data.length, true);
            lv.setUint16(26, nameBytes.length, true);
            lv.setUint16(28, 0, true);
            local.set(nameBytes, 30);

            chunks.push(local, data);

            const header = new Uint8Array(46 + nameBytes.length);
            const cv = new DataView(header.buffer);
            cv.setUint32(0, 0x02014b50, true);
            cv.setUint16(4, 20, true);          // version made by
            cv.setUint16(6, 20, true);          // version needed
            cv.setUint16(8, 0x0800, true);
            cv.setUint16(10, 0, true);
            cv.setUint16(12, dosTime, true);
            cv.setUint16(14, dosDate, true);
            cv.setUint32(16, crc, true);
            cv.setUint32(20, data.length, true);
            cv.setUint32(24, data.length, true);
            cv.setUint16(28, nameBytes.length, true);
            cv.setUint16(30, 0, true);
            cv.setUint16(32, 0, true);
            cv.setUint16(34, 0, true);
            cv.setUint16(36, 0, true);
            cv.setUint32(38, 0, true);
            cv.setUint32(42, offset, true);
            header.set(nameBytes, 46);

            central.push(header);
            offset += local.length + data.length;
        }

        const centralSize = central.reduce((sum, part) => sum + part.length, 0);
        const end = new Uint8Array(22);
        const ev = new DataView(end.buffer);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(8, entries.length, true);
        ev.setUint16(10, entries.length, true);
        ev.setUint32(12, centralSize, true);
        ev.setUint32(16, offset, true);

        const total = offset + centralSize + end.length;
        const out = new Uint8Array(total);
        let at = 0;
        for (const part of chunks) { out.set(part, at); at += part.length; }
        for (const part of central) { out.set(part, at); at += part.length; }
        out.set(end, at);
        return out;
    }

    function download(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function downloadProject() {
        const name = (state.ws.name || "limey-plugin").replace(/[^\w.-]+/g, "-");
        const entries = Object.entries(state.ws.files).map(([path, text]) => ({ name: path, text }));
        if (!entries.length) return toast("Nothing to download yet", true);
        download(new Blob([makeZip(entries)], { type: "application/zip" }), `${name}.zip`);
        toast(`Downloaded ${entries.length} files as ${name}.zip`);
    }

    function downloadActive() {
        const path = state.ws.active;
        if (!path) return toast("Open a file first", true);
        download(new Blob([state.ws.files[path] || ""], { type: "text/plain" }), path.split("/").pop());
    }

    /* ---------------------------------------------------------------------
     * Monaco
     * ------------------------------------------------------------------- */

    function defineTheme(monaco) {
        monaco.editor.defineTheme("limey-dark", {
            base: "vs-dark",
            inherit: true,
            rules: [
                { token: "comment", foreground: "6b7373", fontStyle: "italic" },
                { token: "keyword", foreground: "9ccc3c" },
                { token: "string", foreground: "b6e08b" },
                { token: "number", foreground: "f0b429" },
                { token: "regexp", foreground: "f0b429" },
                { token: "type", foreground: "7ec8e3" },
                { token: "type.identifier", foreground: "7ec8e3" },
                { token: "identifier", foreground: "e6e6e6" },
                { token: "delimiter", foreground: "8b949e" },
                { token: "tag", foreground: "9ccc3c" },
                { token: "attribute.name", foreground: "7ec8e3" }
            ],
            colors: {
                "editor.background": "#0d0d0d",
                "editor.foreground": "#e6e6e6",
                "editorLineNumber.foreground": "#4a4a4a",
                "editorLineNumber.activeForeground": "#9ccc3c",
                "editorCursor.foreground": "#9ccc3c",
                "editor.selectionBackground": "#2c3a1a",
                "editor.inactiveSelectionBackground": "#22300f",
                "editor.lineHighlightBackground": "#141414",
                "editorIndentGuide.background1": "#1f1f1f",
                "editorIndentGuide.activeBackground1": "#3a3a3a",
                "editorWidget.background": "#171717",
                "editorWidget.border": "#262626",
                "editorSuggestWidget.background": "#171717",
                "editorSuggestWidget.border": "#262626",
                "editorSuggestWidget.selectedBackground": "#26320f",
                "editorHoverWidget.background": "#171717",
                "editorHoverWidget.border": "#262626",
                "editorBracketMatch.background": "#1f2a12",
                "editorBracketMatch.border": "#9ccc3c",
                "minimap.background": "#0d0d0d",
                "scrollbarSlider.background": "#2a2a2a80",
                "scrollbarSlider.hoverBackground": "#3a3a3a90"
            }
        });
    }

    function configureLanguages(monaco) {
        const ts = monaco.languages.typescript;
        const options = {
            target: ts.ScriptTarget.ES2022,
            module: ts.ModuleKind.ESNext,
            moduleResolution: ts.ModuleResolutionKind.NodeJs,
            jsx: ts.JsxEmit.ReactJSX,
            allowNonTsExtensions: true,
            allowJs: true,
            checkJs: false,
            strict: false,
            noImplicitAny: false,
            esModuleInterop: true,
            allowSyntheticDefaultImports: true,
            skipLibCheck: true,
            noEmit: true
        };

        for (const defaults of [ts.typescriptDefaults, ts.javascriptDefaults]) {
            defaults.setCompilerOptions(options);
            defaults.setDiagnosticsOptions({ noSemanticValidation: false, noSyntaxValidation: false });
            if (defaults.setEagerModelSync) defaults.setEagerModelSync(true);
            defaults.addExtraLib(LIMEY_DTS, "file:///limey-v1/plugin-api.d.ts");
        }
    }

    function createEditor(monaco) {
        defineTheme(monaco);
        configureLanguages(monaco);

        state.editor = monaco.editor.create(dom.editor, {
            theme: "limey-dark",
            fontFamily: 'ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace',
            fontSize: state.ws.ui.fontSize,
            lineHeight: 1.6,
            tabSize: state.ws.ui.tabSize,
            insertSpaces: true,
            minimap: { enabled: state.ws.ui.minimap },
            wordWrap: state.ws.ui.wordWrap,
            breadcrumbs: { enabled: state.ws.ui.breadcrumbs },
            stickyScroll: { enabled: state.ws.ui.stickyScroll },
            renderWhitespace: state.ws.ui.renderWhitespace,
            automaticLayout: true,
            scrollBeyondLastLine: false,
            smoothScrolling: true,
            renderLineHighlight: "line",
            padding: { top: 10, bottom: 10 },
            cursorBlinking: "smooth",
            cursorSmoothCaretAnimation: "on",
            roundedSelection: false,
            overviewRulerBorder: false,
            scrollbar: { verticalScrollbarSize: 10, horizontalScrollbarSize: 10 },
            suggest: { showWords: true, preview: true },
            quickSuggestions: { other: true, comments: false, strings: false }
        });

        state.editor.onDidChangeCursorPosition(event => {
            dom.statusPos.textContent = `Ln ${event.position.lineNumber}, Col ${event.position.column}`;
        });

        state.editor.onDidChangeModelContent(() => {
            const path = state.ws.active;
            if (!path || !state.editor) return;
            const model = state.editor.getModel();
            state.ws.files[path] = model ? model.getValue() : "";
            state.dirty.add(path);
            dom.statusSaved.textContent = "unsaved";
            dom.statusSaved.className = "";
            scheduleDerived();
            renderTabs();
            persist();
        });

        monaco.editor.onDidChangeMarkers(() => updateProblems());

        applyUi();
        openFile(state.ws.active || Object.keys(state.ws.files)[0]);
    }

    function updateProblems() {
        if (!state.monaco) return;
        const markers = state.monaco.editor.getModelMarkers({});
        const errors = markers.filter(marker => marker.severity === state.monaco.MarkerSeverity.Error).length;
        const warnings = markers.filter(marker => marker.severity === state.monaco.MarkerSeverity.Warning).length;

        const total = errors + warnings;
        dom.statusProblems.textContent = total === 0 ? "0 problems" : `${errors} ✕  ${warnings} ⚠`;
        dom.statusProblems.className = total === 0 ? "ok" : errors ? "err" : "warn";
        dom.statusProblems.title = total === 0
            ? "No problems reported by the language service"
            : `${errors} error(s), ${warnings} warning(s)`;

        dom.problemCount.textContent = String(total);
        dom.problemCount.className = "count" + (errors ? " bad" : "");
        if (!dom.panel.hidden && state.ws.ui.panel === "problems") renderProblems();
    }

    function modelFor(path) {
        if (!state.monaco) return null;
        if (state.models.has(path)) return state.models.get(path);

        const uri = state.monaco.Uri.parse("file:///" + path.split("/").map(encodeURIComponent).join("/"));
        const model = state.monaco.editor.createModel(state.ws.files[path] || "", languageFor(path), uri);
        state.models.set(path, model);
        return model;
    }

    function openFile(path) {
        if (!path) return;
        if (!(path in state.ws.files)) return;
        if (!state.ws.open.includes(path)) state.ws.open.push(path);
        state.ws.active = path;

        if (state.editor) {
            dom.fallback.hidden = true;
            const model = modelFor(path);
            state.editor.setModel(model);
            state.editor.focus();
        } else {
            // Monaco has not loaded (or failed to): plain textarea fallback.
            dom.fallback.hidden = false;
            dom.fallback.value = state.ws.files[path] || "";
        }

        dom.statusPath.textContent = path;
        dom.statusLang.textContent = languageFor(path) || "text";
        renderTabs();
        renderTree();
        updateProblems();
        if (!dom.panel.hidden && state.ws.ui.panel === "outline") renderOutline();
        if (state.ws.ui.preview) refreshPreview();
        persist();
    }

    function closeTab(path) {
        state.ws.open = state.ws.open.filter(open => open !== path);
        const model = state.models.get(path);
        if (model) {
            model.dispose();
            state.models.delete(path);
        }
        state.dirty.delete(path);
        if (state.ws.active === path) {
            state.ws.active = state.ws.open[state.ws.open.length - 1] || Object.keys(state.ws.files)[0] || null;
            if (state.ws.active) openFile(state.ws.active);
            else {
                state.editor && state.editor.setModel(null);
                dom.statusPath.textContent = "no file";
            }
        }
        renderTabs();
        persist();
    }

    /* ---------------------------------------------------------------------
     * Rendering
     * ------------------------------------------------------------------- */

    function renderTree() {
        const tree = buildTree(Object.keys(state.ws.files));
        dom.tree.innerHTML = "";
        const collapsed = state.collapsed || (state.collapsed = new Set());

        function row(label, depth, opts) {
            const node = document.createElement("div");
            node.className = "node" + (opts.active ? " active" : "");
            node.style.paddingLeft = 6 + depth * 12 + "px";
            node.title = opts.title || label;

            const twist = document.createElement("span");
            twist.className = "twist";
            twist.textContent = opts.folder ? (collapsed.has(opts.path) ? "▸" : "▾") : "";
            node.appendChild(twist);

            if (!opts.folder) {
                const ext = document.createElement("span");
                ext.className = "ext " + extLabel(label);
                ext.textContent = extLabel(label).slice(0, 2).toUpperCase();
                node.appendChild(ext);
            }

            const name = document.createElement("span");
            name.className = "name";
            name.textContent = label;
            node.appendChild(name);

            if (!opts.folder && opts.path) {
                const actions = document.createElement("span");
                actions.className = "row-actions";

                const rename = document.createElement("button");
                rename.type = "button";
                rename.title = "Rename";
                rename.textContent = "✎";
                rename.addEventListener("click", event => {
                    event.stopPropagation();
                    renameFile(opts.path);
                });

                const remove = document.createElement("button");
                remove.type = "button";
                remove.title = "Delete";
                remove.textContent = "✕";
                remove.addEventListener("click", event => {
                    event.stopPropagation();
                    deleteFile(opts.path);
                });

                actions.append(rename, remove);
                node.appendChild(actions);
            }

            node.addEventListener("click", () => {
                if (opts.folder) {
                    if (collapsed.has(opts.path)) collapsed.delete(opts.path);
                    else collapsed.add(opts.path);
                    renderTree();
                } else {
                    openFile(opts.path);
                }
            });

            dom.tree.appendChild(node);
        }

        function walk(node, prefix, depth) {
            for (const dir of node.dirs) {
                const path = prefix ? `${prefix}/${dir.name}` : dir.name;
                row(dir.name, depth, { folder: true, path });
                if (!collapsed.has(path)) walk(dir, path, depth + 1);
            }
            for (const file of node.files) {
                const path = prefix ? `${prefix}/${file}` : file;
                row(file, depth, { path, active: path === state.ws.active });
            }
        }

        walk(tree, "", 0);

        const count = Object.keys(state.ws.files).length;
        const lines = Object.values(state.ws.files).reduce((sum, text) => sum + wordCount(text), 0);
        dom.projectMeta.textContent = `${state.ws.name || "untitled"} · ${count} file${count === 1 ? "" : "s"} · ${lines} lines`;
    }

    function renderTabs() {
        dom.tabs.innerHTML = "";
        for (const path of state.ws.open) {
            const tab = document.createElement("div");
            tab.className = "tab" + (path === state.ws.active ? " active" : "") + (state.dirty.has(path) ? " dirty" : "");
            tab.title = path;

            const dot = document.createElement("span");
            dot.className = "dot";
            tab.appendChild(dot);

            const label = document.createElement("span");
            label.textContent = path.split("/").pop();
            tab.appendChild(label);

            const close = document.createElement("button");
            close.type = "button";
            close.className = "close";
            close.textContent = "✕";
            close.title = "Close";
            close.addEventListener("click", event => {
                event.stopPropagation();
                closeTab(path);
            });
            tab.appendChild(close);

            tab.addEventListener("click", () => openFile(path));
            dom.tabs.appendChild(tab);
        }
    }

    /* ---------------------------------------------------------------------
     * File actions
     * ------------------------------------------------------------------- */

    function uniquePath(path) {
        if (!(path in state.ws.files)) return path;
        const dot = path.lastIndexOf(".");
        const base = dot > 0 ? path.slice(0, dot) : path;
        const ext = dot > 0 ? path.slice(dot) : "";
        let n = 2;
        while (`${base}-${n}${ext}` in state.ws.files) n++;
        return `${base}-${n}${ext}`;
    }

    function newFile() {
        const name = prompt("New file path (folders are fine):", `${state.ws.name || "MyPlugin"}/newFile.ts`);
        if (!name) return;
        const path = uniquePath(name.trim().replace(/^\/+/, ""));
        state.ws.files[path] = "";
        state.dirty.add(path);
        renderTree();
        openFile(path);
        persist();
        toast(`Created ${path}`);
    }

    function newFolder() {
        const name = prompt("New folder path:", `${state.ws.name || "MyPlugin"}/components`);
        if (!name) return;
        const folder = name.trim().replace(/^\/+|\/+$/g, "");
        if (!folder) return;
        state.ws.files[`${folder}/.keep`] = "";
        renderTree();
        openFile(`${folder}/.keep`);
        persist();
        toast(`Created ${folder}/`);
    }

    function renameFile(path) {
        const next = prompt("Rename to:", path);
        if (!next) return;
        const cleaned = next.trim().replace(/^\/+/, "");
        if (!cleaned || cleaned === path) return;

        state.ws.files[cleaned] = state.ws.files[path];
        delete state.ws.files[path];
        state.ws.open = state.ws.open.map(open => (open === path ? cleaned : open));
        if (state.ws.active === path) state.ws.active = cleaned;

        const model = state.models.get(path);
        if (model) {
            model.dispose();
            state.models.delete(path);
        }
        renderTree();
        renderTabs();
        openFile(cleaned);
        persist();
        toast(`Renamed to ${cleaned}`);
    }

    function deleteFile(path) {
        if (!confirm(`Delete ${path}? This only affects this browser.`)) return;
        delete state.ws.files[path];
        const model = state.models.get(path);
        if (model) {
            model.dispose();
            state.models.delete(path);
        }
        state.dirty.delete(path);
        state.ws.open = state.ws.open.filter(open => open !== path);
        if (state.ws.active === path) {
            state.ws.active = state.ws.open[0] || Object.keys(state.ws.files)[0] || null;
            if (state.ws.active) openFile(state.ws.active);
        }
        renderTree();
        renderTabs();
        persist();
        toast(`Deleted ${path}`);
    }

    function resetProject() {
        if (!confirm("Restore the demo plugin? Your current files in this browser will be replaced.")) return;
        for (const model of state.models.values()) model.dispose();
        state.models.clear();
        state.dirty.clear();
        state.ws = emptyWorkspace();
        renderTree();
        openFile(state.ws.active);
        persist();
        toast("Demo project restored");
    }

    function uploadFiles(files) {
        if (!files || !files.length) return;
        let added = 0;
        let pending = files.length;

        for (const file of files) {
            const reader = new FileReader();
            reader.onerror = () => { if (--pending === 0) finish(); };
            reader.onload = () => {
                const path = uniquePath(file.name);
                state.ws.files[path] = String(reader.result || "");
                added++;
                if (--pending === 0) finish();
            };
            reader.readAsText(file);
        }

        function finish() {
            renderTree();
            if (added) {
                openFile(Object.keys(state.ws.files)[Object.keys(state.ws.files).length - 1]);
                persist();
                toast(`Added ${added} file${added === 1 ? "" : "s"}`);
            }
        }
    }

     * Commands

    function publishToStore() {
        // Same sessionStorage handoff the old workshop used, so /submit-plugin
        // still prefills the form and attaches the project files.
        const entry = Object.keys(state.ws.files).find(path => /(^|\/)index\.tsx?$/.test(path));
        // The plugin's own description sits at one indent level; settings options
        // have their own description strings further in, so anchor on the line.
        const description = entry
            ? (state.ws.files[entry].match(/^ {4}description:\s*"([^"]*)"/m) || [])[1] || ""
            : "";
        try {
            sessionStorage.setItem("limey-publish-payload", JSON.stringify({
                name: state.ws.name || "",
                description,
                tags: [],
                authorName: "",
                files: { ...state.ws.files }
            }));
        } catch { /* storage full — the form still opens, just unprefilled */ }
        window.location.href = "/submit-plugin";
    }

    /* ---------------------------------------------------------------------
     * Workspace search — pure functions, no DOM, so a harness can test them
     * ------------------------------------------------------------------- */

    const searchOpts = { caseSensitive: false, regex: false, wholeWord: false };

    function escapeRegExp(text) {
        return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function makeSearchRegExp(query, options) {
        const opts = options || {};
        const source = opts.regex ? query : escapeRegExp(query);
        const wrapped = opts.wholeWord ? "\\b(?:" + source + ")\\b" : source;
        return new RegExp(wrapped, opts.caseSensitive ? "g" : "gi");
    }

    /** Every match of query across the workspace, grouped per file. */
    function searchWorkspace(query, options) {
        const groups = [];
        if (!query) return groups;
        let flags;
        try {
            flags = makeSearchRegExp(query, options);
        } catch {
            return groups;
        }

        for (const path of Object.keys(state.ws.files).sort()) {
            const lines = String(state.ws.files[path] || "").split("\n");
            const hits = [];
            for (let index = 0; index < lines.length; index++) {
                const line = lines[index];
                const re = new RegExp(flags.source, flags.flags);
                let match;
                let guard = 0;
                while ((match = re.exec(line)) && guard++ < 500) {
                    hits.push({ line: index + 1, column: match.index + 1, text: line });
                    if (!match[0]) re.lastIndex++;
                }
            }
            if (hits.length) groups.push({ path, hits });
        }
        return groups;
    }

    /** Replace every match everywhere; returns how much changed. */
    function replaceInWorkspace(query, replacement, options) {
        let pattern;
        try {
            pattern = makeSearchRegExp(query, options);
        } catch {
            return { files: 0, count: 0, error: "invalid pattern" };
        }

        let files = 0;
        let count = 0;
        for (const path of Object.keys(state.ws.files)) {
            const text = String(state.ws.files[path] || "");
            const matches = text.match(new RegExp(pattern.source, pattern.flags));
            if (!matches || !matches.length) continue;
            count += matches.length;
            files++;
            const next = text.replace(new RegExp(pattern.source, pattern.flags), replacement);
            state.ws.files[path] = next;
            const model = state.models.get(path);
            if (model && model.getValue() !== next) model.setValue(next);
        }
        return { files, count };
    }

    /** Top-level declarations of a file, for the outline panel. */
    const OUTLINE_RULES = [
        { kind: "function", re: /^\s*(?:export\s+)?(?:default\s+)?(?:async\s+)?function\s+([\w$]+)/ },
        { kind: "class", re: /^\s*(?:export\s+)?(?:default\s+)?(?:abstract\s+)?class\s+([\w$]+)/ },
        { kind: "interface", re: /^\s*(?:export\s+)?interface\s+([\w$]+)/ },
        { kind: "type", re: /^\s*(?:export\s+)?type\s+([\w$]+)\s*=/ },
        { kind: "enum", re: /^\s*(?:export\s+)?enum\s+([\w$]+)/ },
        { kind: "const", re: /^\s*(?:export\s+)?(?:const|let|var)\s+([\w$]+)\s*[:=]/ },
        { kind: "heading", re: /^(#{1,6})\s+(.+)$/ },
        { kind: "selector", re: /^([.#][\w-][^{,]*)\s*\{/ }
    ];

    function outlineFor(path, text) {
        const language = languageFor(path);
        const rows = [];
        const lines = String(text || "").split("\n");

        lines.forEach((line, index) => {
            if (/^\s*\/\//.test(line)) return;
            for (const rule of OUTLINE_RULES) {
                if (rule.kind === "heading" && language !== "markdown") continue;
                if (rule.kind === "selector" && language !== "css" && language !== "scss") continue;
                const match = rule.re.exec(line);
                if (!match) continue;
                rows.push({
                    label: rule.kind === "heading" ? match[2].trim() : match[1].trim(),
                    kind: rule.kind,
                    line: index + 1
                });
                return;
            }
        });
        return rows;
    }

    /** "42", "42:7" and "42,7" all mean line 42. */
    function parseGotoLine(value) {
        const match = String(value || "").trim().match(/^(\d+)(?:\s*[:,]\s*(\d+))?$/);
        if (!match) return null;
        return { line: Number(match[1]), column: match[2] ? Number(match[2]) : 1 };
    }

    /* ---------------------------------------------------------------------
     * Live CSS preview
     * ------------------------------------------------------------------- */

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function previewDocument() {

    /* ---------------------------------------------------------------------
     * Panel: problems, outline, search
     * ------------------------------------------------------------------- */

    function pathFromMarkerUri(uri) {
        if (!uri) return null;
        try {
            return decodeURIComponent(String(uri.path || "").replace(/^\//, ""));
        } catch {
            return null;
        }
    }

    function gotoLocation(path, line, column) {
        if (!path || !(path in state.ws.files)) return;
        openFile(path);
        if (!state.editor) return;
        const position = { lineNumber: Math.max(1, Number(line) || 1), column: Math.max(1, Number(column) || 1) };
        state.editor.revealPositionInCenter(position);
        state.editor.setPosition(position);
        state.editor.focus();
    }

    function openPanel(tab) {
        state.ws.ui.panelOpen = true;
        if (tab) state.ws.ui.panel = tab;
        dom.panel.hidden = false;
        renderPanel();
        persist();
        if (tab === "search") dom.searchInput.focus();
    }

    function closePanel() {
        state.ws.ui.panelOpen = false;
        dom.panel.hidden = true;
        persist();
    }

    function togglePanel() {
        if (dom.panel.hidden) openPanel(state.ws.ui.panel || "problems");
        else closePanel();
    }

    function renderPanel() {
        const tab = state.ws.ui.panel || "problems";
        for (const button of dom.panel.querySelectorAll("[data-panel]")) {
            button.classList.toggle("active", button.dataset.panel === tab);
        }
        dom.problemsBody.hidden = tab !== "problems";
        dom.outlineBody.hidden = tab !== "outline";
        dom.searchBody.hidden = tab !== "search";

        if (tab === "problems") renderProblems();
        else if (tab === "outline") renderOutline();
        else renderSearchResults();
    }

    function renderProblems() {
        if (!dom.problemsBody) return;
        dom.problemsBody.innerHTML = "";
        if (!state.monaco) {
            dom.problemsBody.innerHTML = '<div class="panel-empty">The language service is not loaded, so there are no problems to list.</div>';
            return;
        }

        const markers = state.monaco.editor.getModelMarkers({}).slice(0, 200);
        if (!markers.length) {
            dom.problemsBody.innerHTML = '<div class="panel-empty">No problems in this workspace.</div>';
            return;
        }

        const severity = state.monaco.MarkerSeverity;
        markers.sort((a, b) => (a.severity - b.severity) || String(a.resource && a.resource.path).localeCompare(String(b.resource && b.resource.path)) || a.startLineNumber - b.startLineNumber);

        for (const marker of markers) {
            const path = pathFromMarkerUri(marker.resource);
            const row = document.createElement("div");
            row.className = "panel-row";
            row.title = marker.message;

            const glyph = document.createElement("span");
            const level = marker.severity === severity.Error ? "error" : marker.severity === severity.Warning ? "warning" : "info";
            glyph.className = "sev " + level;
            glyph.textContent = level === "error" ? "✕" : level === "warning" ? "⚠" : "ⓘ";
            row.appendChild(glyph);

            const where = document.createElement("span");
            where.className = "where";
            where.textContent = (path || "unknown").split("/").pop() + ":" + marker.startLineNumber;
            row.appendChild(where);

            const message = document.createElement("span");
            message.className = "src";
            message.textContent = marker.message;
            row.appendChild(message);

            row.addEventListener("click", () => gotoLocation(path, marker.startLineNumber, marker.startColumn));
            dom.problemsBody.appendChild(row);
        }
    }

    function renderOutline() {
        if (!dom.outlineBody) return;
        dom.outlineBody.innerHTML = "";
        const path = state.ws.active;
        if (!path) {
            dom.outlineBody.innerHTML = '<div class="panel-empty">Open a file to see its declarations.</div>';
            return;
        }

        const rows = outlineFor(path, state.ws.files[path] || "");
        if (!rows.length) {
            dom.outlineBody.innerHTML = '<div class="panel-empty">No top-level declarations found in ' + escapeHtml(path.split("/").pop()) + ".</div>";
            return;
        }

        for (const entry of rows) {
            const row = document.createElement("div");
            row.className = "panel-row";

            const where = document.createElement("span");
            where.className = "where";
            where.textContent = String(entry.line);
            row.appendChild(where);

            const label = document.createElement("span");
            label.className = "src";
            label.textContent = entry.label;
            row.appendChild(label);

            const kind = document.createElement("span");
            kind.className = "where";
            kind.style.marginLeft = "auto";
            kind.textContent = entry.kind;
            row.appendChild(kind);

            row.addEventListener("click", () => gotoLocation(path, entry.line, 1));
            dom.outlineBody.appendChild(row);
        }
    }

    function renderSearchResults() {
        if (!dom.searchResults) return;
        const query = dom.searchInput.value;
        dom.searchResults.innerHTML = "";

        if (!query) {
            dom.searchResults.innerHTML = '<div class="panel-empty">Search every file in the project. Results are grouped by file.</div>';
            return;
        }

        const groups = searchWorkspace(query, searchOpts);
        if (!groups.length) {
            dom.searchResults.innerHTML = '<div class="panel-empty">No matches for ' + escapeHtml(query) + ".</div>";
            return;
        }

        for (const group of groups) {
            const wrapper = document.createElement("div");
            wrapper.className = "file-group";

            const head = document.createElement("div");
            head.className = "file-head";
            head.textContent = group.path;
            const count = document.createElement("span");
            count.className = "hits";
            count.textContent = String(group.hits.length);
            head.appendChild(count);
            head.addEventListener("click", () => gotoLocation(group.path, group.hits[0].line, group.hits[0].column));
            wrapper.appendChild(head);

            for (const hit of group.hits.slice(0, 50)) {
                const row = document.createElement("div");
                row.className = "panel-row hit";

                const where = document.createElement("span");
                where.className = "where";
                where.textContent = hit.line + ":" + hit.column;
                row.appendChild(where);

                const snippet = document.createElement("span");
                snippet.className = "src";
                snippet.textContent = hit.text.trim().slice(0, 180);
                row.appendChild(snippet);

                row.addEventListener("click", () => gotoLocation(group.path, hit.line, hit.column));
                wrapper.appendChild(row);
            }

            dom.searchResults.appendChild(wrapper);
        }
    }

    function openSettings() {
        dom.settingsGrid.innerHTML = "";
        for (const field of SETTING_FIELDS) {
            const wrap = document.createElement("label");
            wrap.className = "field" + (field.type === "check" ? " check" : "");
            wrap.dataset.key = field.key;

            let control;
            if (field.type === "check") {
                control = document.createElement("input");
                control.type = "checkbox";
                control.checked = Boolean(state.ws.ui[field.key]);
            } else if (field.type === "select") {
                control = document.createElement("select");
                for (const option of field.options) {
                    const choice = document.createElement("option");
                    choice.value = option;
                    choice.textContent = option;
                    if (state.ws.ui[field.key] === option) choice.selected = true;
                    control.appendChild(choice);
                }
            } else {
                control = document.createElement("input");
                control.type = "number";
                control.min = String(field.min);
                control.max = String(field.max);
                control.value = String(state.ws.ui[field.key]);
            }

            const text = document.createElement("span");
            text.textContent = field.label;
            if (field.type === "check") wrap.append(control, text);
            else wrap.append(text, control);

            if (field.help) {
                const help = document.createElement("small");
                help.textContent = field.help;
                wrap.appendChild(help);
            }

            dom.settingsGrid.appendChild(wrap);
        }
        dom.settingsOverlay.hidden = false;
    }

    function closeSettings() {
        dom.settingsOverlay.hidden = true;
    }

    function saveSettings() {
        for (const field of SETTING_FIELDS) {
            const wrap = dom.settingsGrid.querySelector('[data-key="' + field.key + '"]');
            if (!wrap) continue;
            const control = wrap.querySelector("input, select");
            if (!control) continue;
            if (field.type === "check") state.ws.ui[field.key] = control.checked;
            else if (field.type === "number") {
                const value = Number(control.value);
                const min = field.min == null ? value : field.min;
                const max = field.max == null ? value : field.max;
                state.ws.ui[field.key] = Math.min(max, Math.max(min, Number.isFinite(value) ? value : field.min));
            } else state.ws.ui[field.key] = control.value;
        }
        applyUi();
        persist();
        closeSettings();
        toast("Editor settings updated");
    }

    /** Formats the active file; returns true when something could format it. */
    function formatDocument() {
        const path = state.ws.active;
        if (!path || !state.editor) return false;
        const model = state.editor.getModel();
        if (!model) return false;

        // JSON is formatted here so the result is predictable; every other
        // language goes through the formatter Monaco already ships.
        if (languageFor(path) === "json") {
            try {
                const pretty = JSON.stringify(JSON.parse(model.getValue()), null, 4);
                state.editor.executeEdits("limey-code-format", [{ range: model.getFullModelRange(), text: pretty }]);
                toast("JSON formatted");
                return true;
            } catch {
                toast("That JSON has a syntax error", true);
                return false;
            }
        }

        const action = state.editor.getAction("editor.action.formatDocument");
        if (!action) {
            toast("No formatter available for " + languageFor(path), true);
            return false;
        }
        Promise.resolve(action.run()).then(
            () => toast("Formatted"),
            () => toast("No formatter available for " + languageFor(path), true)
        );
        return true;
    }

    function matches(haystack, needle) {
        return haystack.toLowerCase().includes(needle.toLowerCase());
    }

    function openPalette() {
        dom.palette.hidden = false;
        dom.paletteInput.value = "";
