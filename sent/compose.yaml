services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_PG_PASSWORD:?set SENTINEL_PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional but recommended for shared replay protection & rate limits.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: .
    image: limey-guard:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SENTINEL_ADDR: "0.0.0.0:8080"
      SENTINEL_PG_DSN: "postgres://sentinel:${SENTINEL_PG_PASSWORD}@postgres:5432/sentinel?sslmode=disable"
      SENTINEL_REDIS_ADDR: "redis:6379"
      # Generate with:  openssl rand -hex 32   (>= 32 bytes, keep secret)
      SENTINEL_TOKEN_SECRET: ${SENTINEL_TOKEN_SECRET:?generate one with openssl rand -hex 32}
      SENTINEL_CLIENT_PEPPER: ${SENTINEL_CLIENT_PEPPER:-}
      # First-run administrator (create then unset in production!)
      SENTINEL_ADMIN_USER: ${SENTINEL_ADMIN_USER:-}
      SENTINEL_ADMIN_PASSWORD: ${SENTINEL_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
