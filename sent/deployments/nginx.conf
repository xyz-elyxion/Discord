# Example: nginx in front of an existing app, verifying Sentinel tokens.
# Requires the Sentinel server reachable at http://sentinel:8080
server {
  listen 443 ssl http2;
  server_name protected.example.com;

  ssl_certificate     /etc/letsencrypt/live/protected.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/protected.example.com/privkey.pem;

  # pass the real client IP to the app (and to Sentinel's trusted proxes)
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;

  # Example A: origin does the validation itself (recommended)
  # origin middleware/REST sees the token in the header/body.
  location /api/contact {
    # token validated by the app; here we just forward.
    proxy_pass http://origin:3000;
  }

  # Example B: authenticate at the proxy with auth_request.
  # Nginx auth_request cannot forward the original body, so we expose a tiny
  # njs/fs module or have the origin delegate. Practical pattern:
  # the front-end SDK ALSO submit tokens via a header to a location that
  # nginx proxies to Sentinel for an authorization check: see /v1/token/validate.
  location /api/paid-content {
    proxy_pass http://origin:3000;
    # note: full auth_request with body forwarding requires
    # https://github.com/nginx/njs or a sidecar — keep this in mind when
    # designing reverse-proxy enforcement.
  }
}

# Direct proxy to Sentinel dashboard/API (self-hosted console)
server {
  listen 443 ssl http2;
  server_name sentinel.example.com;
  ssl_certificate     /etc/letsencrypt/live/sentinel.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sentinel.example.com/privkey.pem;

  location / {
    proxy_pass http://sentinel:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }
}
