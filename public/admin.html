<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Limey V1 — Admin Panel</title>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/style.css" />
<style>
    body {
        background: #0d0f13;
        color: #e6e6e6;
        font-family: "gg sans", "Segoe UI", system-ui, sans-serif;
        display: flex;
        justify-content: center;
        padding: 48px 16px;
        min-height: 100vh;
        margin: 0;
        box-sizing: border-box;
    }
    .panel {
        width: 100%;
        max-width: 720px;
        background: #16181d;
        border: 1px solid #2a2d34;
        border-radius: 12px;
        padding: 32px;
    }
    h1 {
        margin: 0 0 4px;
        font-size: 24px;
        color: #9eea6f;
    }
    .sub {
        color: #8b909b;
        font-size: 14px;
        margin-bottom: 24px;
    }
    .card {
        background: #1d2026;
        border: 1px solid #2a2d34;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
    }
    label {
        display: block;
        font-size: 13px;
        color: #b8bdc7;
        margin: 12px 0 4px;
    }
    input, select {
        width: 100%;
        box-sizing: border-box;
        background: #0d0f13;
        color: #e6e6e6;
        border: 1px solid #343842;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 14px;
    }
    input:focus, select:focus {
        outline: none;
        border-color: #9eea6f;
    }
    button {
        background: #9eea6f;
        color: #10130a;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 12px;
    }
    button:hover { filter: brightness(1.1); }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .msg.err { color: #ff6b6b; }
    .msg.ok { color: #9eea6f; }
    .hidden { display: none; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    .whoami {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: #b8bdc7;
    }
    .whoami img {
        width: 28px;
        height: 28px;
        border-radius: 50%;
    }
    .logout {
        background: transparent;
        color: #ff6b6b;
        border: 1px solid #ff6b6b;
        padding: 4px 10px;
        font-size: 12px;
        margin: 0 0 0 auto;
    }
</style>
</head>
<body>
<div class="panel">
    <h1>Limey V1 Admin</h1>
    <p class="sub">Sign in with Discord. Access is restricted to the admin role in the Limey server.</p>

    <div class="card" id="login">
        <button id="loginbtn">Login with Discord</button>
        <div class="msg" id="loginmsg"></div>
    </div>

    <div class="card hidden" id="whoami">
        <div class="whoami">
            <img id="meavatar" alt="" />
            <span id="mename"></span>
            <button class="logout" id="logoutbtn">Log out</button>
        </div>
    </div>

    <div id="content" class="hidden">
        <div class="card">
            <h2>Donation codes</h2>
            <p class="sub" style="margin-bottom:8px">Generate codes for donors. They redeem them at /limes for Limes and/or a perk tier (30 days).</p>
            <label for="donlimes">Limes (optional)</label>
            <input type="number" id="donlimes" placeholder="e.g. 1000" min="0" />
            <label for="dontier">Tier (optional)</label>
            <select id="dontier">
                <option value="">None</option>
                <option value="seedling">Seedling</option>
                <option value="grove">Grove</option>
                <option value="orchard">Orchard</option>
            </select>
            <label for="doncount">How many</label>
            <input type="number" id="doncount" value="1" min="1" max="50" />
            <button id="gendon">Generate codes</button>
            <div class="msg" id="donmsg"></div>
            <textarea id="doncodes" rows="4" class="hidden" style="width:100%;margin-top:8px;background:#0d0f13;color:#9eea6f;border:1px solid #343842;border-radius:6px;padding:10px 12px;font-size:13px;font-family:monospace" readonly></textarea>
        </div>
    </div>
</div>

<script>
    const SESSION_KEY = "limey-admin-session";

    function authHeaders() {
        return { "Content-Type": "application/json", "Authorization": "Bearer " + (localStorage.getItem(SESSION_KEY) || "") };
    }

    function show(el, text, ok) {
        el.textContent = text;
        el.className = "msg " + (ok ? "ok" : "err");
    }

    function unlock(me) {
        document.getElementById("login").classList.add("hidden");
        document.getElementById("whoami").classList.remove("hidden");
        document.getElementById("content").classList.remove("hidden");
        document.getElementById("meavatar").src = me.user?.avatar || "";
        document.getElementById("mename").textContent = me.user ? (me.user.globalName || me.user.username) : me.discordId;
    }

    function lock() {
        localStorage.removeItem(SESSION_KEY);
        document.getElementById("login").classList.remove("hidden");
        document.getElementById("whoami").classList.add("hidden");
        document.getElementById("content").classList.add("hidden");
    }

    document.getElementById("loginbtn").onclick = () => {
        const redirect = window.location.origin + "/v1/oauth/callback";
        window.location.href = "https://discord.com/oauth2/authorize"
            + "?client_id=1514929209158402078"
            + "&redirect_uri=" + encodeURIComponent(redirect)
            + "&response_type=code&scope=identify%20guilds.members.read&state=admin";
    };

    document.getElementById("logoutbtn").onclick = () => { lock(); };

    document.getElementById("gendon").onclick = async () => {
        const msg = document.getElementById("donmsg");
        const limes = Number(document.getElementById("donlimes").value) || 0;
        const tier = document.getElementById("dontier").value;
        const count = Number(document.getElementById("doncount").value) || 1;
        if (!limes && !tier) return show(msg, "Enter Limes and/or a tier.", false);

        const res = await fetch("/v1/admin/limes/donation-codes", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ limes, tier: tier || null, count })
        });
        const data = await res.json();
        if (res.ok) {
            show(msg, `Generated ${data.codes.length} code(s). Copy them now:`, true);
            const ta = document.getElementById("doncodes");
            ta.value = data.codes.join("\n");
            ta.classList.remove("hidden");
            ta.select();
        } else if (res.status === 401) {
            lock();
        } else {
            show(msg, data.error || "Failed to generate codes.", false);
        }
    };

    (async () => {
        // OAuth bounce-back: ?session=<token>
        const params = new URLSearchParams(window.location.search);
        const sessionParam = params.get("session");
        if (sessionParam) {
            localStorage.setItem(SESSION_KEY, sessionParam);
            history.replaceState(null, "", "/admin");
        }
        const loginFailed = params.get("login");
        if (loginFailed) {
            const msg = document.getElementById("loginmsg");
            if (loginFailed === "forbidden") show(msg, "You don't have the admin role in the Limey server.", false);
            else if (loginFailed === "missing_code") show(msg, "Login was incomplete — please try again.", false);
            else show(msg, "Discord login failed — please try again.", false);
            history.replaceState(null, "", "/admin");
            return;
        }

        const token = localStorage.getItem(SESSION_KEY);
        if (!token) return;
        try {
            const res = await fetch("/v1/admin/me", { headers: authHeaders() });
            if (!res.ok) throw new Error("unauthorized");
            unlock(await res.json());
        } catch {
            lock();
        }
    })();
</script>
</body>
</html>
