<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #1a1d23;
            --bg-soft: #22262e;
            --border: #333a45;
            --lime: #b8d977;
            --lime-dim: #9dbb5c;
            --text: #ece8df;
            --muted: #9aa1ad;
            --danger: #e06c5f;
        }

        * { box-sizing: border-box; }

        body {
            width: 300px;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px 12px;
            border-bottom: 1px solid var(--border);
        }

        .header img { width: 34px; height: 34px; border-radius: 8px; }

        .title { font-weight: 650; font-size: 14px; }
        .subtitle { margin-top: 1px; color: var(--muted); font-size: 11.5px; }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 16px 4px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-soft);
            font-size: 12px;
        }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
        .dot.ok { background: var(--lime); box-shadow: 0 0 6px rgba(184, 217, 119, .5); }
        .dot.bad { background: var(--danger); }

        .status .detail { color: var(--muted); margin-left: auto; font-size: 11.5px; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }

        .btn {
            appearance: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-soft);
            color: var(--text);
            font: inherit;
            padding: 9px 10px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .btn:hover { border-color: var(--lime-dim); background: #262b34; }
        .btn.wide { grid-column: 1 / -1; background: rgba(184, 217, 119, .12); border-color: rgba(184, 217, 119, .4); }
        .btn.wide:hover { background: rgba(184, 217, 119, .2); }

        .footer {
            padding: 10px 16px 13px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 11px;
        }

        .footer a { color: var(--lime-dim); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon.png" alt="">
        <div>
            <div class="title">Limey V1 Web</div>
            <div class="subtitle">The cutest Discord mod, in your browser</div>
        </div>
    </div>

    <div class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Checking this tab…</span>
        <span class="detail" id="statusDetail"></span>
    </div>

    <div class="actions">
        <a class="btn wide" href="https://discord.com/channels/@me" target="_blank" rel="noreferrer">Open Discord</a>
        <a class="btn" href="https://limey-discord.onrender.com/download" target="_blank" rel="noreferrer">Download page</a>
        <a class="btn" href="https://limey-discord.onrender.com/plugins" target="_blank" rel="noreferrer">Plugins site</a>
        <button class="btn wide" id="shortcutsBtn">Configure keyboard shortcuts</button>
    </div>

    <div class="footer">
        <span id="version">Limey V1 v—</span>
        <a href="https://github.com/Vee/cord" target="_blank" rel="noreferrer">Source</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
