<!DOCTYPE html>
<!-- Limey V1 Ghost Client — ESP canvas.
     This window is snapped exactly over the Discord client window by the main
     process and is fully transparent + click-through. It draws the plugin
     effects AT THEIR POSITIONS IN DISCORD (member-list rows etc.), like game
     ESP — but rendered by our own window, never by Discord, so it is invisible
     to Discord's screen share. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Limey V1 Ghost Client — ESP</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
    }
    #esp { position: relative; width: 100%; height: 100%; }

    .esp-anchor {
        position: absolute;
        pointer-events: none;
    }

    /* The crown: drawn right at the owner's row in the member list. */
    .esp-crown {
        font-size: 18px;
        line-height: 18px;
        filter: drop-shadow(0 0 6px rgba(255, 208, 64, 0.9));
        transform: translate(-50%, -55%);
        animation: esp-pulse 2.4s ease-in-out infinite;
    }
    @keyframes esp-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.75; }
    }

    /* Status badge: proof the canvas is really there and what it is waiting
       for (a faint hint so an empty ESP canvas is never a mystery). */
    #esp-badge {
        position: absolute;
        top: 6px;
        left: 8px;
        padding: 3px 10px;
        font-family: "gg sans", "Segoe UI", system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: rgba(255, 208, 64, 0.95);
        background: rgba(10, 12, 15, 0.72);
        border: 1px solid rgba(255, 208, 64, 0.35);
        border-radius: 8px;
        pointer-events: none;
        transition: opacity 0.4s;
    }
    #esp-badge.dim { opacity: 0.55; }
</style>
</head>
<body>
    <div id="esp"></div>
    <div id="esp-badge">🎯 ESP on…</div>
    <script src="esp.js"></script>
</body>
</html>
